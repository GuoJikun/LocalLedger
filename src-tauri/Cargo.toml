[package]
name = "local-ledger"
version = "0.1.0"
description = "净账 — 本地运行、离线优先的记账软件"
authors = ["LocalLedger"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "local_ledger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
encoding_rs = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
tauri-plugin-dialog = "2"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
